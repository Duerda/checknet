<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Teste a velocidade da sua internet e veja o que ela suporta.">
  <title>CheckNet</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Teste a velocidade de sua internet</h1>
    <p class="intro">Veja o que sua conexão consegue rodar bem no dia a dia.</p>
    <button id="testButton" type="button" onclick="mostrarVelocidade()">
      <span id="buttonLabel">Iniciar Teste</span>
    </button>
    <section id="resultado" aria-live="polite" hidden></section>
    <p class="footnote">A velocidade é estimada pelo navegador e pode variar.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
