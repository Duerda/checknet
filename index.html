<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Descubra o que sua conexão de internet consegue fazer.">
  <title>CheckNet — teste sua conexão</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <div class="brand" aria-label="CheckNet">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <span>Check<span>Net</span></span>
    </div>

    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">Diagnóstico simples da sua conexão</p>
      <h1 id="page-title">O que dá para fazer<br><em>com a sua internet?</em></h1>
      <p class="intro">Veja sua velocidade estimada e descubra quais atividades rodam bem no seu dia a dia.</p>
      <button id="testButton" type="button" onclick="mostrarVelocidade()">
        <span class="button-icon" aria-hidden="true">↗</span>
        <span id="buttonLabel">Iniciar teste</span>
      </button>
    </section>

    <section id="resultado" class="result" aria-live="polite" hidden></section>

    <p class="footnote">A velocidade é estimada pelo navegador e pode variar durante o dia.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
